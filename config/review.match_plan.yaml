# Eval-only portfolio arm. Shipped fast/deep configs remain default-off until
# every quality, safety, latency, and blind-comparison launch gate passes.
evidence_portfolio_enabled: true
max_rounds: 3
score_threshold: 85
reviewers:
  - name: fact-check
    gate: true
    weight: 0
    model_tier: premium
  - name: ats-keyword
    gate: false
    weight: 1
    model_tier: mid
  - name: recruiter
    gate: false
    weight: 1
    model_tier: mid
  - name: hiring-manager
    gate: false
    weight: 1
    model_tier: premium
  - name: concision
    gate: false
    weight: 1
    model_tier: mid

length_budget:
  max_experiences: 4
  max_projects: 2
  max_evidence_owners: 5
  max_bullets_per_role: 5
  max_bullets_per_project: 3
  target_total_bullets: 20
