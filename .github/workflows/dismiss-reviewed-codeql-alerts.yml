name: Dismiss reviewed CodeQL false positives

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dismiss-reviewed-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Record reviewed false positives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          dismiss_alert() {
            local alert_number="$1"
            local comment="$2"
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/code-scanning/alerts/${alert_number}" \
              -f state=dismissed \
              -f 'dismissed_reason=false positive' \
              --raw-field "dismissed_comment=${comment}"
          }

          dismiss_alert 45 "HIBP's Pwned Passwords range API mandates SHA-1. This value is not stored or used for authentication; the request sends only its five-character prefix over TLS."
          dismiss_alert 46 "The cookie is a random opaque transaction handle, not state or the PKCE verifier. Sensitive flow data remains server-side, expires after 10 minutes, and is atomically consumed once."
          dismiss_alert 47 "This SHA-256 operation is HMAC session and token signing keyed by the server session secret, not password hashing. Password storage remains PBKDF2-HMAC-SHA256 with a per-password salt and 600000 iterations."
