name: Require dev as PR source

# main only accepts merges from dev (see CLAUDE.md > Branching). This check
# fails any pull request into main whose head branch isn't dev, so it can be
# marked as a required status check in main's branch protection alongside
# the ci-main.yml checks.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  require-dev-base:
    name: require-dev-base
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch is dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Pull requests into main must come from the 'dev' branch (got '${{ github.head_ref }}')."
            exit 1
          fi
