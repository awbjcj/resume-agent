[project]
name = "resume-agent"
version = "0.1.0"
description = "Personal AI job-hunt, resume-tailoring, and application-tracking pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=2.6.12",
    "anthropic>=0.107.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.1.0",
    "openai>=1.0.0",
    # agno 2.6.x's Gemini Interactions import expects the `step_delta` submodule,
    # which google-genai renamed to `stepdelta` in 2.9.0 — cap below it.
    "google-genai>=2.5.0,<2.9.0",
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.197.0",
    "google-auth>=2.53.0",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.28.1",
    "playwright>=1.60.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.13.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.38",
    "streamlit>=1.58.0",
    "textual>=8.2.7",
    "typer>=0.26.7",
    "typst>=0.14.9",
    "markdownify>=0.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.18",
]

[project.scripts]
resume-agent = "resume_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/resume_agent/taxonomy/data/sic_codes.json" = "resume_agent/taxonomy/data/sic_codes.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
