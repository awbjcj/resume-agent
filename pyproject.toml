[project]
name = "resume-agent"
version = "0.1.0"
description = "Personal AI job-hunt, resume-tailoring, and application-tracking pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=2.6.12",
    "anthropic>=0.107.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.13.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.38",
    "typer>=0.26.7",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
resume-agent = "resume_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
